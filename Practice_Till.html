 ["",[["Wet","#6a5d9a"],["Foam","#6a5d9a"],["Dry","#6a5d9a"],["Extra Dry","#6a5d9a"],["Ice","#6a4a5d"],["Light Ice","#6a4a5d"],["Extra Ice","#6a4a5d"]]],

 return Math.max(0,p)}

function codes(it){const syr=Object.entries(it.syr).map(([k,v])=>v+(SYRUPS.find(s=>s[0]===k)||[0,k])[1]).join(" ");
 const milk=(MILKS.find(m=>m[0]===it.milk)||[0,it.milk])[1];
 const cus=Object.entries(it.mods).map(([k,v])=>(v>1?v:"")+ab(k)).filter(Boolean).join(" ");
 return{decaf:it.decaf==="Decaf"?"X":it.decaf?"½X":"",shots:(it.esp==="Blonde"?"B":"")+(it.shots||""),syr,milk:it.d.milk==="None"&&it.milk==="None"?"":milk,cus,drink:(it.iced&&!/^Iced|Frapp|Cold|Refresha|Aerocano/.test(it.d.n)?"I":"")+it.d.code}}

function renderLeft(){let h="";order.forEach((it,i)=>{const s=i===sel?" sel":"";

 const sub=[];sub.push(it.mods["For Here Cup"]?"For Here Cup":it.mods["Own Cup"]?"Own Cup":"Takeaway Cup");

 const t=$("target");if(target){t.style.display="block";t.innerHTML=`<b>Customer:</b> “${target.text}”<div class="r">${target.msg||"Ring it up, then press Functions → Check."}</div>`}else t.style.display="none"}

 $("strip").innerHTML=`<select class="pill" data-ch="size">${SIZES.map(s=>`<option ${s===it.size?"selected":""} ${it.iced&&s==="Short"?"disabled":""}>${s}</option>`).join("")}</select>

function renderArea(){const A=$("area");
 if(panel==="drinks"&&tab!=="Drinks"){A.innerHTML=`<div class="panel" style="background:#2a2a2d;color:#ccc"><div class="wm">${tab}</div><p style="margin-top:60px;text-align:center">${tab} isn't set up in this practice till — drinks only.</p></div>`;return}

  cells.forEach(row=>row.forEach(x=>h+=x?`<button class="tile" style="background:linear-gradient(${x.c},${lerp(x.c,"#000000",.12)})" data-a="drink" data-v="${D.indexOf(x.d)}">${x.d.n}</button>`:`<div class="tile blank"></div>`));
  h+=`<div class="seas">Seasonal</div>`;let si=0;DR.slice(DR.findIndex(d=>d[2]==="S")).forEach((d,i)=>{if(!d[0]){h+=`<div class="tile blank"></div>`;return}
   const dd=D.find(x=>x.n===d[0]);h+=`<button class="tile" style="background:linear-gradient(${SEAS_C[i]||"#4e3c31"},${lerp(SEAS_C[i]||"#4e3c31","#000000",.2)});font-size:${d[0].length>22?14:16}px" data-a="drink" data-v="${D.indexOf(dd)}">${d[0]}</button>`});
  A.innerHTML=h+`</div>`;return}
 const it=cur();if(!it){panel="drinks";return renderArea()}
 if(panel==="toppings"){let h=`<div class="panel"><div class="wm">Toppings</div><div class="cols">`;
  TOP.forEach(([t,c,items])=>{h+=`<div class="col"><h5>${t||"&nbsp;"}</h5><div class="g">`;items.forEach(x=>{if(!x){h+=`<div style="height:70px"></div>`;return}
   const n=it.mods[x]||0;const col=/Protein/.test(x)?"#7c9e6b":/Drizzle/.test(x)?"#6f9b8f":/Apple|Strawberry Cream|Matcha Cream/.test(x)&&/Foam/.test(x)?"#719a86":c;
   h+=`<div class="mt ${UNAVAIL.has(x)?"x":""}" style="background:${col}"><b data-a="top" data-v="${x}" data-d="-1">−</b><span>${x}</span><b data-a="top" data-v="${x}" data-d="1">+</b>${n?`<i class="n">${n}</i>`:""}</div>`});h+=`</div></div>`});
  A.innerHTML=h+`</div><button id="allergy" data-a="allergy">Allergy Notification</button></div>`;return}
 if(panel==="prep"){let h=`<div class="panel"><div class="wm">Prep</div><div class="cols" style="gap:8px">`;
  PREP.forEach(([t,items])=>{h+=`<div class="col"><h5 style="font-size:${t.length>11?17:19}px">${t||"&nbsp;"}</h5><div class="g">`;
   items.forEach(([x,c])=>{if(!c){h+=`<div style="height:${x===" "?144:78}px"></div>`;return}h+=`<button class="pt ${it.mods[x]?"on":""}" style="background:${c}" data-a="prep" data-v="${x}">${x}</button>`});h+=`</div></div>`});
  A.innerHTML=h+`</div><button id="allergy" data-a="allergy">Allergy Notification</button></div>`;return}
 if(panel==="milk"){let h=`<div class="panel"><div class="wm">Milk</div><div class="cols" style="flex-wrap:wrap;gap:10px;margin-top:40px">`;
  MILKS.forEach(([m,c])=>h+=`<button class="pt ${it.milk===m?"on":""}" style="background:${["Oat","Almond","Soy","Coconut"].includes(m)?"#9a8a4a":"#8295a6"};width:150px" data-a="milk" data-v="${m}">${m}<br><small>${c}</small></button>`);
  A.innerHTML=h+`</div></div>`;return}
 if(panel==="syrups"){let h=`<div class="panel"><div class="wm">Syrups</div><p style="margin:34px 0 6px;color:#555">Tap + / − to add pumps. Default pumps for ${it.size}: ${defPumps(it.d,it.size,it.iced,"hot")}.</p><div class="cols" style="flex-wrap:wrap;gap:10px;margin-top:6px">`;
  SYRUPS.forEach(([s,c])=>{const n=it.syr[s]||0;h+=`<div class="mt" style="background:${/Mocha|Chai|Pumpkin/.test(s)?"#8a5a3a":"#a0583a"}"><b data-a="syr" data-v="${s}" data-d="-1">−</b><span>${s}<br><small>${c}</small></span><b data-a="syr" data-v="${s}" data-d="1">+</b>${n?`<i class="n">${n}</i>`:""}</div>`});
  A.innerHTML=h+`</div></div>`;return}}

/* ---------- ACTIONS ---------- */
function modal(html){const m=$("modal");m.innerHTML=`<div class="mbox">${html}</div>`;m.style.display=html?"flex":"none"}
function labelHTML(it,n,tot){const c=codes(it);return `<div class="lbl"><div style="display:flex;justify-content:space-between;font-weight:700;border-bottom:1px solid #ccc"><span>${SAB[it.size]} ${it.d.n.slice(0,18)}</span><span>${n}/${tot}</span></div>
 ${[["DECAF",c.decaf],["SHOTS",c.shots],["SYRUP",c.syr],["MILK",c.milk],["CUSTOM",c.cus],["DRINK",c.drink]].map(([k,v])=>`<div class="l"><i>${k}</i><span>${v||""}</span></div>`).join("")}</div>`}
function excl(it,x){EXCL.forEach(g=>{if(g.includes(x))g.forEach(y=>{if(y!==x)delete it.mods[y]})})}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,v=el.dataset.v,it=cur();
 switch(a){
 case"rotx":$("rot").style.display="none";try{sessionStorage.setItem("rotx",1)}catch(_){}return;
 case"tab":tab=v==="Search"?"Drinks":v;panel="drinks";break;
 case"pre":pre.size=v;if(it){resize(it,v,it.iced)}break;
 case"preT":if(v==="iced")pre.iced=!pre.iced;if(v==="blonde")pre.blonde=true;if(v==="sig")pre.blonde=false;if(v==="decaf")pre.decaf=!pre.decaf;break;
 case"drink":{const d=D[+v];order.push(makeItem(d,pre.size,pre.iced,pre.blonde,pre.decaf));sel=order.length-1;pre.iced=false;pre.blonde=false;pre.decaf=false;break}
 case"selline":sel=+v;panel="drinks";break;
 case"del":if(sel>=0){order.splice(sel,1);sel=order.length-1}break;
 case"itIced":if(it&&canIce(it.d)&&canHot(it.d))resize(it,it.size,!it.iced);break;
 case"decaf":if(it)it.decaf=it.decaf===""?"Decaf":it.decaf==="Decaf"?"1/2 Decaf":"";break;
 case"shot":if(it)it.shots=Math.max(0,it.shots+ +v);break;
 case"pump":if(it){const k=Object.keys(it.syr).pop();if(!k){panel="syrups";break}it.syr[k]+= +v;if(it.syr[k]<=0)delete it.syr[k]}break;
 case"panel":if(it)panel=v;break;
 case"esp":if(it)it.esp=v;break;
 case"qsyr":if(it){if(v in it.syr)delete it.syr[v];else it.syr[v]=defPumps(it.d,it.size,it.iced,"hot")}break;
 case"qmilk":if(it)it.milk=it.milk===v?it.d.milk:v;break;
 case"qmod":if(it){if(it.mods[v])delete it.mods[v];else{excl(it,v);it.mods[v]=1}}break;
 case"top":if(it&&!UNAVAIL.has(v)){const n=(it.mods[v]||0)+ +el.dataset.d;if(n<=0)delete it.mods[v];else it.mods[v]=n}break;
 case"prep":if(it){if(it.mods[v])delete it.mods[v];else{excl(it,v);it.mods[v]=1}}break;
 case"milk":if(it)it.milk=v;break;
 case"syr":if(it){const n=(it.syr[v]||0)+(+el.dataset.d);if(n<=0)delete it.syr[v];else it.syr[v]=it.syr[v]?n:Math.max(n,el.dataset.d>0?defPumps(it.d,it.size,it.iced,"hot"):0)}break;
 case"allergy":modal(`<h3>Allergy Notification</h3><p>In store: tell the customer about allergens, check the allergen guide, use clean equipment and flag the drink to the bar.</p><div class="row"><button class="pri" data-a="close">OK</button></div>`);return;
 case"fn":modal(`<h3>Functions</h3><div class="row"><button class="pri" data-a="practice">${target?"Stop practice":"🎯 Start practice order"}</button>${target?`<button class="pri" data-a="check">✓ Check my order</button><button data-a="skip">Skip</button>`:""}</div>
  <div class="row"><button data-a="clear">Clear order</button><button data-a="help">Button guide</button><button data-a="close">Close</button></div>${score.n?`<p>Practice score: <b>${score.ok}/${score.n}</b></p>`:""}`);return;
 case"help":modal(`<h3>Button guide</h3><p><b>Sig / B</b> Signature / Blonde espresso · <b>C / V</b> caramel / vanilla syrup · <b>N / O</b> skimmed / oat milk · <b>XH</b> extra hot · <b>WC</b> whipped cream.</p><p>Pick size (and Iced / Blonde / Decaf) at the top first, then tap the drink. Change it in the grey strip. <b>Toppings…</b> and <b>Prep…</b> open the custom screens. Tap the Milk box or the syrup number for the full lists. Tap <b>Drink</b> to go back to drinks.</p><p style="color:#666">Practice till — prices and codes are approximations.</p><div class="row"><button class="pri" data-a="close">OK</button></div>`);return;
 case"close":modal("");return;
 case"clear":order=[];sel=-1;panel="drinks";modal("");break;
 case"practice":modal("");if(target){target=null}else{newTarget()}break;
 case"skip":modal("");newTarget();break;
 case"check":modal("");check();break;
 case"pay":{if(!order.length)return;const tot=order.reduce((a,i)=>a+price(i),0);
  const cash=[...new Set([Math.ceil(tot),5,10,20,50].filter(x=>x>=tot))];
  modal(`<h3>Pay £${money(tot)}</h3><div class="row">${cash.map(c=>`<button data-a="paid" data-v="${c}">Cash £${c}</button>`).join("")}</div><div class="row"><button class="pri" data-a="paid" data-v="card">💳 Card / Contactless</button><button class="pri" data-a="paid" data-v="app">📱 App</button><button data-a="close">Back</button></div>`);return}
 case"paid":{const tot=order.reduce((a,i)=>a+price(i),0);const msg=v==="card"?"Card approved":v==="app"?"Paid with app":`Cash £${v} — <b>Change £${money(+v-tot)}</b>`;
  const labels=order.map((it,i)=>labelHTML(it,i+1,order.length)).join("");order=[];sel=-1;panel="drinks";
  modal(`<h3>✓ ${msg}</h3><p>Cup labels printed:</p>${labels}<div class="row"><button class="pri" data-a="close">New order</button></div>`);render();return}
 }
 render()});
document.addEventListener("change",e=>{if(e.target.dataset.ch==="size"&&cur()){resize(cur(),e.target.value,cur().iced);render()}});

/* ---------- PRACTICE ---------- */
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function newTarget(){const d=rnd(D.filter(x=>x.col!=="S"||Math.random()<.5));let size=rnd(d.t==="i"?["Tall","Grande","Venti"]:SIZES.slice(d.code==="E"||d.code==="EM"?0:0));
 if(d.code==="E"||d.code==="EM")size="Short";let iced=d.t==="i"||(d.t==="b"&&Math.random()<.3);if(iced&&size==="Short")size="Tall";
 const t=makeItem(d,size,iced,false,false),p=[];
 const r=Math.random;
 if(t.shots&&r()<.2){t.esp="Blonde";p.push("blonde")}
 if(t.shots&&r()<.15){t.decaf="Decaf";p.push("decaf")}
 if(t.d.milk!=="None"&&r()<.4){t.milk=rnd(["Oat","Almond","Soy","Skimmed","Whole","Coconut"].filter(m=>m!==t.milk));p.push(t.milk.toLowerCase()+" milk")}
 if(t.shots&&r()<.3){t.shots++;p.push("an extra shot")}
 if(r()<.3){const s=rnd(["Vanilla","Caramel","Hazelnut","SF Vanilla","Toffee Nut"].filter(x=>!(x in t.syr)));t.syr[s]=defPumps(d,size,iced,"hot");p.push(s.toLowerCase()+" syrup")}
 if(r()<.35){const opts=iced?["Light Ice","Extra Ice","Cream Cold Foam","Caramel Drizzle","Whipped Cream"]:["Extra Hot","Dry","Caramel Drizzle","Whipped Cream","For Here Cup"];const x=rnd(opts.filter(o=>!t.mods[o]));
  if(x){excl(t,x);t.mods[x]=1;p.push(x.toLowerCase()+(x==="For Here Cup"?" (drinking in)":""))}}
 if(t.mods["Whipped Cream"]&&d.top["Whipped Cream"]&&r()<.2){delete t.mods["Whipped Cream"];p.push("no whip")}
 const nm=(iced&&canHot(d)?"iced ":"")+d.n;
 t.text=`Hi, can I get a ${d.code==="E"||d.code==="EM"?"":size+" "}${nm}${p.length?", "+p.join(", "):""}, please?`;target=t;order=[];sel=-1;panel="drinks";tab="Drinks";pre={size:"Grande",iced:false,blonde:false,decaf:false}}
function check(){const t=target,it=cur()||order[order.length-1],errs=[];if(!it){t.msg=`<span class="bad">Nothing rung up yet.</span>`;return}
 if(it.d!==t.d)errs.push(`Drink: ${t.d.n}`);if(it.size!==t.size&&!(t.d.code==="E"||t.d.code==="EM"))errs.push(`Size: ${t.size}`);if(it.iced!==t.iced)errs.push(t.iced?"Should be iced":"Should be hot");
 if(it.shots!==t.shots)errs.push(`Shots: ${t.shots}`);if(it.esp!==t.esp)errs.push(`Espresso: ${t.esp}`);if(it.decaf!==t.decaf)errs.push(`Decaf: ${t.decaf||"no"}`);
 const j=o=>JSON.stringify(Object.entries(o).sort());if(j(it.syr)!==j(t.syr))errs.push(`Syrup: ${Object.entries(t.syr).map(([k,v])=>v+" "+k).join(", ")||"none"}`);
 if(it.milk!==t.milk)errs.push(`Milk: ${t.milk}`);if(j(it.mods)!==j(t.mods))errs.push(`Custom: ${Object.keys(t.mods).join(", ")||"none"}`);
 score.n++;if(!errs.length){score.ok++;const m=`<span class="ok">✓ Perfect! £${money(price(it))} · score ${score.ok}/${score.n}</span>`;setTimeout(()=>{newTarget();target.msg=m;render()},900);t.msg=m}
 else t.msg=`<span class="bad">✗ ${errs.join("<br>✗ ")}</span><br>Score ${score.ok}/${score.n}`}

function fit(){const w=innerWidth,h=innerHeight,s=Math.min(w/1280,h/800);const st=$("stage");st.style.transform=`scale(${s})`;st.style.left=(w-1280*s)/2+"px";st.style.top=(h-800*s)/2+"px";
 let x=0;try{x=sessionStorage.getItem("rotx")}catch(_){}$("rot").style.display=(h>w&&w<700&&!x)?"block":"none"}
addEventListener("resize",fit);fit();
const tick=()=>$("clock").textContent=new Date().toLocaleString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});tick();setInterval(tick,1000);
render();
